---
# Analyzer Service - Development Deployment Specification
# Part of Credit Contract Compliance Evaluation Platform (Phase 1)

service:
  name: aicc-analyzer
  version: 0.1.0
  description: Analyzer service for contract compliance evaluation
  environment: development
  region: us-east-1

deployment:
  compute:
    type: lambda  # Or Fargate for Phase 1 pilot
    runtime: python3.11
    memory: 1024
    timeout: 300
    ephemeral_storage: 512
  
  logging:
    level: INFO
    format: json
    cloudwatch_group: /aws/lambda/aicc-analyzer-dev
    retention_days: 7

application:
  app_name: aicc-analyzer
  app_version: 0.1.0
  host: 0.0.0.0
  port: 8080
  context_path: /analyzer
  
  # FastAPI settings
  api:
    title: AICC Analyzer Service
    description: Analyzer service for contract compliance evaluation
    version: 0.1.0
    docs_url: /docs
    openapi_url: /openapi.json

aws_services:
  region: us-east-1
  
  # SQS Queues
  sqs:
    analyzer_queue: aicc-analyzer-queue-dev
    status_queue: aicc-status-queue-dev
    audit_queue: aicc-audit-queue-dev
    dlq_max_receive_count: 3
  
  # S3 Buckets
  s3:
    contract_documents_bucket: aicc-contract-documents-dev
    documents_prefix: contract-docs/
    kms_encryption: true
  
  # Database
  dynamodb:
    execution_state_table: evaluation_execution_state_dev
  
  # AI Services
  textract:
    enabled: true
    api_version: 2018-06-27
  
  bedrock:
    enabled: true
    model_id: anthropic.claude-3-sonnet-20240229-v1:0
    max_tokens: 2048
    temperature: 0.3

database:
  postgres:
    analyzer_db:
      host: localhost
      port: 5432
      database: analyzer_db_dev
      username: analyzer_user
      password: ${DB_PASSWORD}
      min_pool_size: 2
      max_pool_size: 10
      ssl_mode: require
      timeout: 10
    
    compliance_db:
      host: localhost
      port: 5432
      database: compliance_db_dev
      username: compliance_user
      password: ${DB_PASSWORD}
      connection_timeout: 10

external_services:
  contract_service:
    base_url: https://api-dev.example.com/contract-service
    timeout: 30
    retry_attempts: 3
    auth_type: oauth2
  
  document_lake:
    base_url: https://dmp-dev.example.com/documents
    timeout: 60
    retry_attempts: 3
    auth_type: api_key
  
  prompt_management:
    base_url: http://localhost:8000/prompts
    timeout: 10
    cache_enabled: false

monitoring:
  cloudwatch:
    enabled: true
    metrics_namespace: AICC/Analyzer/Dev
    detailed_monitoring: true
  
  xray:
    enabled: false  # Disabled for Phase 1 pilot
    sampling_rate: 0.1
  
  performance:
    track_execution_time: true
    track_token_usage: true
    track_costs: true

security:
  secrets_manager:
    enabled: true
    rotation_enabled: false  # Enable after pilot
    secret_name_prefix: aicc/analyzer/dev/
  
  encryption:
    at_rest: true
    kms_key_id: arn:aws:kms:us-east-1:ACCOUNT_ID:key/KEY_ID
    in_transit: true
    tls_version: "1.2"
  
  authentication:
    service_to_service: jwt  # Evaluation Service to Analyzer
    request_signing: aws_sigv4

feature_flags:
  enable_textract: true
  enable_bedrock: true
  enable_rule_caching: false
  enable_document_caching: false
  max_concurrent_analyses: 5
  batch_processing_enabled: true

phase_1_scope:
  account_types: [TFS_RETAIL]
  max_accounts_per_batch: 100
  accounts_per_day_estimate: 100
  contract_sources: [D5]
  rule_engine: local_seed  # Not REST API yet

# Health Check Configuration
health_check:
  interval_seconds: 30
  timeout_seconds: 5
  healthy_threshold: 2
  unhealthy_threshold: 3
  path: /health
