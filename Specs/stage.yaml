---
# Analyzer Service - Staging Deployment Specification
# Part of Credit Contract Compliance Evaluation Platform (Phase 1)

service:
  name: aicc-analyzer
  version: 0.1.0
  description: Analyzer service for contract compliance evaluation
  environment: staging
  region: us-east-1

deployment:
  compute:
    type: fargate  # Fargate for staging (mirrors production)
    runtime: python3.11
    memory: 1536
    timeout: 300
    ephemeral_storage: 768
  
  logging:
    level: INFO
    format: json
    cloudwatch_group: /aws/fargate/aicc-analyzer-stage
    retention_days: 14

application:
  app_name: aicc-analyzer
  app_version: 0.1.0
  host: 0.0.0.0
  port: 8080
  context_path: /analyzer
  
  # FastAPI settings
  api:
    title: AICC Analyzer Service
    description: Analyzer service for contract compliance evaluation
    version: 0.1.0
    docs_url: /docs
    openapi_url: /openapi.json

aws_services:
  region: us-east-1
  
  # SQS Queues
  sqs:
    analyzer_queue: aicc-analyzer-queue-stage
    status_queue: aicc-status-queue-stage
    audit_queue: aicc-audit-queue-stage
    dlq_max_receive_count: 3
  
  # S3 Buckets
  s3:
    contract_documents_bucket: aicc-contract-documents-stage
    documents_prefix: contract-docs/
    kms_encryption: true
  
  # Database
  dynamodb:
    execution_state_table: evaluation_execution_state_stage
  
  # AI Services
  textract:
    enabled: true
    api_version: 2018-06-27
  
  bedrock:
    enabled: true
    model_id: anthropic.claude-3-sonnet-20240229-v1:0
    max_tokens: 2048
    temperature: 0.3

database:
  postgres:
    analyzer_db:
      host: analyzer-db-stage.c9akciq32.us-east-1.rds.amazonaws.com
      port: 5432
      database: analyzer_db_stage
      username: analyzer_user
      password: ${DB_PASSWORD}
      min_pool_size: 3
      max_pool_size: 15
      ssl_mode: require
      timeout: 10
    
    compliance_db:
      host: compliance-db-stage.c9akciq32.us-east-1.rds.amazonaws.com
      port: 5432
      database: compliance_db_stage
      username: compliance_user
      password: ${DB_PASSWORD}
      connection_timeout: 10

external_services:
  contract_service:
    base_url: https://api-stage.example.com/contract-service
    timeout: 30
    retry_attempts: 4
    auth_type: oauth2
  
  document_lake:
    base_url: https://dmp-stage.example.com/documents
    timeout: 60
    retry_attempts: 4
    auth_type: api_key
  
  prompt_management:
    base_url: https://prompts-stage.example.com/api
    timeout: 10
    cache_enabled: true

monitoring:
  cloudwatch:
    enabled: true
    metrics_namespace: AICC/Analyzer/Stage
    detailed_monitoring: true
  
  xray:
    enabled: true
    sampling_rate: 0.2
  
  performance:
    track_execution_time: true
    track_token_usage: true
    track_costs: true

security:
  secrets_manager:
    enabled: true
    rotation_enabled: true  # Enabled for staging
    rotation_days: 45
    secret_name_prefix: aicc/analyzer/stage/
  
  encryption:
    at_rest: true
    kms_key_id: arn:aws:kms:us-east-1:ACCOUNT_ID:key/KEY_ID
    in_transit: true
    tls_version: "1.3"
  
  authentication:
    service_to_service: jwt  # Evaluation Service to Analyzer
    request_signing: aws_sigv4

feature_flags:
  enable_textract: true
  enable_bedrock: true
  enable_rule_caching: true
  enable_document_caching: true
  max_concurrent_analyses: 10
  batch_processing_enabled: true

phase_1_scope:
  account_types: [TFS_RETAIL]
  max_accounts_per_batch: 100
  accounts_per_day_estimate: 100
  contract_sources: [D5]
  rule_engine: local_seed  # Not REST API yet

# Health Check Configuration
health_check:
  interval_seconds: 20
  timeout_seconds: 5
  healthy_threshold: 2
  unhealthy_threshold: 2
  path: /health

# Auto-scaling
autoscaling:
  enabled: true
  min_tasks: 1
  max_tasks: 5
  target_cpu_utilization: 75
  target_memory_utilization: 80
