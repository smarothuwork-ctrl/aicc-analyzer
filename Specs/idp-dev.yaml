---
apiVersion: aicc/v1
kind: Component
metadata:
  name: aicc-analyzer
  namespace: aicc
  version: 0.1.0
  description: Analyzer Service for Contract Compliance Evaluation Platform
  component_shortname: aicc-analyzer
  environment: dev
  owner: AICC_Team
  appcode: aicc-analyzer

spec:
  aws:
    account_id: "106573904847"
    rolenames:
      - aicc-analyzer-role-dev
      - aicc-analyzer-task-role-dev
    alb:
      app_healthcheck_path: /analyzer/health
      app_context_path: /analyzer/*
      healthy_threshold: 3
      unhealthy_threshold: 3
    regions:
      - region: us-east-1
        subnets:
          - subnet-0de1d95fcab5482d9
          - subnet-012cdc86dd7cdb070
        security_groups:
          - sg-027c05e94fb382c8
    arn:
      arn:aws:elasticloadbalancing:us-east-1:106573904847:loadbalancer/app/aicc-alb-dev/aicc-analyzer-dev
    alb_dns: internal-aicc-alb-dev.us-east-1.elb.amazonaws.com
    ecr:
      regions:
        - region: us-east-1
          vpc_id: vpc-04fcc60bf72c81c6a
          subnets:
            - subnet-012cdc86dd7cdb070
            - subnet-0de1d95fcab5482d9
          security_groups:
            - sg-0a7a0dffe4b2b0c9c

  environment_variables:
    DT_TAGS: "env:dev region:us-east-1 AppCode:aicc-analyzer AccountID:106573904847"
    DT_TENANT: "fs12101"
    DT_TENANTTOKEN: "FSS0b2ZqSSkAiFF"
    LD_PRELOAD: "/opt/dynatrace/oneagent/agent/lib64/liboneagentproc.so"
    DT_NETWORK_ZONE: "z1z2"
    DT_LOGLEVELCON: "info"
    DT_CUSTOM_PROP: "ApplicationService=aicc-analyzer"
    DT_CONNECTION_POINT: "[https://mavio.tfscloud.com:9999/comm]"
    cluster_name: aicc-ecs-dev
    service_name: aicc-analyzer-dev
    service_family_name: aicc-analyzer-dev
    execution_role_name: aicc-analyzer-task-role-dev
    task_role_name: aicc-dev-task-role
    task_cpu: 1024
    task_memory: 2048
    desired_count: 2
    wait_timeout: 300
    container:
      name: aicc-analyzer-dev
      port: 8080
    environment_variables:
      spring.profiles.active: dev
      JAVA_TOOL_OPTIONS: "-Dspring.io.tmpdir=/tmp"
      ENVIRONMENT: dev
      DB_HOST_NAME_PORT: "aicc-analyzer-dev-rds-cluster.cluster-c0h2uoq1da.us-east-1.rds.amazonaws.com:5432"
      DB_NAME: "analyzer_db_dev"
      DB_USERNAME: "analyzer-dev-task-role"
      autoscaling:
        enabled: true
        min_capacity: 2
        max_capacity: 10
        target_cpu_utilization: 75
        target_memory_utilization: 80
        scale_in_cooldown_period: 300
        scale_out_cooldown_period: 60

    codedeploy:
      app_name: aicc-analyzer-dev
      deployment_group_name: aicc-analyzer-dev
      service_role_name: aicc-analyzer-codedeploy-role-dev
      strategy: BLUE_GREEN
      route53:
        hosted_zone_id: Z0983324827EE5AB52LN
        domain_name: aicc-analyzer.dev.aws.tfacloud.com
        subdomain: analyzer
        type: failover
        record_type: A
        health_check:
          alarm_name: Route53HealthCheckAlarm-aicc-analyzer
          namespace: AWS/ApplicationELB
          metric_name: HTTPCode_Target_5XX_Count
          dimensions:
            - Name: LoadBalancer
              Value: app/aicc-alb-dev/4b3d0d8290088d95
            - Name: TargetGroup
              Value: targetgroup/aicc-analyzer-tg-dev/40f0527000f7
          comparison_operator: GreaterThanThreshold
          evaluation_periods: 2
          period: 60
          threshold: 5
          statistic: Sum
          treat_missing_data: breaching
        tags:
          Environment: dev
          OrCaaAI: IMCcvt2
          AppCode: aicc-analyzer
      cloudwatch:
        log_group_name: /ecs/aicc/aicc-analyzer-dev
        alarms:
          - alarm_name: Route53HealthCheckAlarm-aicc-analyzer
            namespace: AWS/ApplicationELB
            metric_name: HTTPCode_Target_5XX_Count
            dimensions:
              - Name: LoadBalancer
                Value: app/aicc-alb-dev/4b3d0d8290088d95
              - Name: TargetGroup
                Value: targetgroup/aicc-analyzer-tg-dev/40f0527000f7
              - Name: ComparisonOperator
                Value: GreaterThanThreshold
              - Name: EvaluationPeriods
                Value: 2
              - Name: Period
                Value: 60
              - Name: Threshold
                Value: 5
              - Name: Statistics
                Value: Sum
              - Name: treat_missing_data
                Value: breaching
        description: "Alarm for ALB 5XX errors for aicc-analyzer"

  database:
    enable_db_migration: false
    migration_tool: "liquibase"
    host: "aicc-analyzer-dev-rds-cluster.cluster-c0h2uoq1da.us-east-1.rds.amazonaws.com"
    dbname: "analyzer_db_dev"
    schema: "analyzer_schema"
    username: "analyzer-dev-task-role"
    port: 5432
    region: us-east-1
    credential_arn: "arn:aws:secretsmanager:us-east-1:106573904847:secret:aicc-analyzer-dev"
    use_existing_init: "false"
    liquibase_changelog_file: "changelog-master.xml"
    liquibase_labels: ""

  sqs:
    analyzer_queue: aicc-analyzer-queue-dev
    status_queue: aicc-status-queue-dev
    audit_queue: aicc-audit-queue-dev
    dlq_max_receive_count: 3

  s3:
    contract_documents_bucket: aicc-contract-documents-dev
    documents_prefix: contract-docs/
    kms_encryption: true

  dynamodb:
    execution_state_table: evaluation_execution_state_dev

  external_services:
    contract_service:
      base_url: https://api-dev.example.com/contract-service
      timeout: 30
      retry_attempts: 3
      auth_type: oauth2
    document_lake:
      base_url: https://dmp-dev.example.com/documents
      timeout: 60
      retry_attempts: 3
      auth_type: api_key
    bedrock:
      model_id: anthropic.claude-3-sonnet-20240229-v1:0
      max_tokens: 2048
      temperature: 0.3
