openapi: 3.0.0
info:
  title: Contract Compliance Check Orchestrator
  description: Orchestrator for contract compliance evaluation
  version: 0.1.0
  contact:
    name: AICC Team
    email: aicc@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080
    description: Development server
  - url: http://localhost:8080/analyzer
    description: Analyzer service root

paths:
  /:
    get:
      summary: Root endpoint
      description: Returns welcome message from contract compliance check service
      operationId: getRoot
      tags:
        - Root
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Hello from contract-compliance-check"

  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the service
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - healthy
                      - unhealthy
                    example: "healthy"
                  service:
                    type: string
                    example: "contract-compliance-check-orchestrator-cccodr"
                  version:
                    type: string
                    example: "0.1.0"
                  environment:
                    type: string
                    example: "dev"

tags:
  - name: Root
    description: Root service endpoints
  - name: Health
    description: Health check endpoints

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
        service:
          type: string
        version:
          type: string
        environment:
          type: string
      required:
        - status
        - service
        - version
        - environment

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
      required:
        - error
        - message
